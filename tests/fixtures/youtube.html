<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mock YouTube</title></head>
<body style="margin:0;background:#0f0f0f;font-family:sans-serif;color:#fff">
  <ytd-ad-slot-renderer id="promo">Рекламная карточка</ytd-ad-slot-renderer>
  <ytd-reel-shelf-renderer id="shorts">Shorts</ytd-reel-shelf-renderer>
  <ytd-browse page-subtype="home"><div id="primary"><ytd-rich-grid-renderer id="homefeed">Лента</ytd-rich-grid-renderer></div></ytd-browse>


  <ytd-watch-flexy id="watch"><div id="player" style="position:relative">
  <div id="cinematics-container">кинорежим YouTube</div>
  <div id="movie_player" class="html5-video-player" style="position:relative;width:800px;height:450px;margin:40px;background:#000">
    <video class="html5-main-video" style="width:100%;height:100%"></video>
    <div class="ytp-chrome-bottom" style="position:absolute;left:12px;right:12px;bottom:44px;height:6px">
      <div class="ytp-heat-map-container" style="position:absolute;left:0;right:0;bottom:8px;height:30px;pointer-events:none">
        <div class="ytp-heat-map-chapter" style="width: 776px; left: 0px; position: absolute; top: 0; bottom: 0;">
          <svg viewBox="0 0 1000 100" preserveAspectRatio="none" width="100%" height="100%"><path class="ytp-heat-map-path" d=""></path></svg>
        </div>
      </div>
      <div class="ytp-progress-bar" style="position:relative;height:100%;background:rgba(255,255,255,.25)"></div>
      <div class="ytp-right-controls" style="position:absolute;right:0;top:12px;display:flex">
        <div class="ytp-right-controls-left" style="display:flex">
          <button class="ytp-autonav-toggle"><div class="ytp-autonav-toggle-button" aria-checked="true"></div></button>
          <button class="ytp-button ytp-settings-button" style="width:48px;height:40px">⚙</button>
        </div>
      </div>
    </div>
    <div class="ytp-ce-element" id="endcard">Карточка</div>
    <div class="ytp-settings-menu" style="position:absolute;right:10px;bottom:60px;width:300px;height:250px;overflow:hidden;background:#222;color:#fff">
      <div class="ytp-popup-content"><div class="ytp-panel" style="height:250px">
        <div class="ytp-panel-menu"><div class="ytp-menuitem"><div class="ytp-menuitem-label">Скорость воспроизведения</div><div class="ytp-menuitem-content">Обычная</div></div><div class="ytp-menuitem" role="menuitemcheckbox" id="yt-lighting"><div class="ytp-menuitem-label">Профессиональное освещение</div></div></div>
        <div class="ytp-variable-speed-panel-content" style="height:193px">
          <div class="ytp-variable-speed-panel-display"><span>1.00x</span></div>
          <button class="ytp-button ytp-variable-speed-panel-increment-button" id="speedMinus"><span>-</span></button>
          <button class="ytp-button ytp-variable-speed-panel-increment-button" id="speedPlus"><span>+</span></button>
          <div class="ytp-variable-speed-panel-chips">
            <div class="ytp-variable-speed-panel-preset-button-wrapper"><button class="ytp-button ytp-variable-speed-panel-preset-button"><span>1,0</span></button></div>
            <div class="ytp-variable-speed-panel-preset-button-wrapper"><button class="ytp-button ytp-variable-speed-panel-preset-button"><span>1,5</span></button></div>
            <div class="ytp-variable-speed-panel-preset-button-wrapper"><button class="ytp-button ytp-variable-speed-panel-preset-button" id="chip2"><span>2,0</span></button></div>
            <div class="ytp-variable-speed-panel-preset-button-wrapper" id="premiumWrapper"><button class="ytp-button ytp-variable-speed-panel-preset-button" id="chipPremium"><div class="ytp-variable-speed-panel-premium-upsell-icon">P</div><span>3,0</span></button></div>
          </div>
        </div>
      </div></div>
    </div>
    <div class="ytp-tooltip" style="display:none;position:absolute;bottom:60px;background:#222;padding:4px 8px;border-radius:8px">
      <div class="ytp-tooltip-text-wrapper">
        <div class="ytp-tooltip-progress-bar-pill" style="display:flex;gap:8px;align-items:center">
          <div class="ytp-tooltip-progress-bar-pill-time-stamp">0:00</div>
          <div class="ytp-tooltip-progress-bar-pill-title">Глава 1</div>
        </div>
      </div>
    </div>
    <button class="ytp-skip-ad-button" style="display:none;position:absolute;right:0;bottom:80px">Пропустить</button>
  </div>
  </div></ytd-watch-flexy>
  <ytd-masthead style="position:relative;display:block;height:56px"><div id="background" style="position:absolute;inset:0;background:#fff"></div></ytd-masthead>

  <ytd-watch-flexy>
    <ytd-watch-metadata>
      <segmented-like-dislike-button-view-model>
        <like-button-view-model><button class="ytSpecButtonShapeNextHost ytSpecButtonShapeNextIconLeading"><div class="ytSpecButtonShapeNextIcon">👍</div><div class="ytSpecButtonShapeNextButtonTextContent">1,2 тыс.</div></button></like-button-view-model>
        <dislike-button-view-model><button class="ytSpecButtonShapeNextHost ytSpecButtonShapeNextIconButton"><div class="ytSpecButtonShapeNextIcon">👎</div></button></dislike-button-view-model>
      </segmented-like-dislike-button-view-model>
    </ytd-watch-metadata>
    <div id="secondary"><div id="related">Рекомендации</div></div>
    <div id="comments">Комментарии</div>
  </ytd-watch-flexy>

  <ytd-topbar-logo-renderer id="logo">
    <a id="logo"><div><ytd-logo><yt-icon id="logo-icon"><span class="yt-icon-shape">YouTube</span></yt-icon></ytd-logo></div></a>
    <span id="country-code">DE</span>
  </ytd-topbar-logo-renderer>
  <ytmusic-logo><a class="ytmusic-logo"><img alt="Music" width="71" height="24"></a></ytmusic-logo>
  <!-- Сетка как на главной: flex с переносом, рекламная карточка перед полкой на всю ширину. -->
  <ytd-rich-grid-renderer id="grid" style="--ytd-rich-grid-items-per-row:3;--ytd-rich-grid-item-margin:16px;display:block;width:900px">
    <div id="contents" style="display:flex;flex-wrap:wrap">
      <ytd-rich-item-renderer class="g" style="display:block;width:calc(33.33% - 16px);margin:0 16px 20px 0;height:60px">1</ytd-rich-item-renderer>
      <ytd-rich-item-renderer class="g" style="display:block;width:calc(33.33% - 16px);margin:0 16px 20px 0;height:60px"><div id="content"><ytd-ad-slot-renderer>реклама</ytd-ad-slot-renderer></div></ytd-rich-item-renderer>
      <ytd-rich-item-renderer class="g" style="display:block;width:calc(33.33% - 16px);margin:0 16px 20px 0;height:60px">3</ytd-rich-item-renderer>
      <ytd-rich-item-renderer class="g" style="display:block;width:calc(33.33% - 16px);margin:0 16px 20px 0;height:60px">4</ytd-rich-item-renderer>
      <ytd-rich-item-renderer class="g" style="display:block;width:calc(33.33% - 16px);margin:0 16px 20px 0;height:60px">5</ytd-rich-item-renderer>
      <ytd-rich-item-renderer class="g" style="display:block;width:calc(33.33% - 16px);margin:0 16px 20px 0;height:60px">6</ytd-rich-item-renderer>
      <ytd-rich-section-renderer id="shelf" style="display:block;width:100%;height:80px">полка</ytd-rich-section-renderer>
      <ytd-rich-item-renderer class="g" style="display:block;width:calc(33.33% - 16px);margin:0 16px 20px 0;height:60px">7</ytd-rich-item-renderer>
      <ytd-rich-item-renderer class="g" style="display:block;width:calc(33.33% - 16px);margin:0 16px 20px 0;height:60px">8</ytd-rich-item-renderer>
    </div>
  </ytd-rich-grid-renderer>
  <a id="shortslink" href="/shorts/OTHERVIDEO1">Shorts</a>
  <ytd-popup-container>
    <yt-confirm-dialog-renderer style="display:none">
      <span>Видео приостановлено. Продолжить просмотр?</span>
      <div id="confirm-button"><button>Да</button></div>
    </yt-confirm-dialog-renderer>
  </ytd-popup-container>

  <script>
    const player = document.getElementById("movie_player");
    const video = player.querySelector("video");
    const skip = player.querySelector(".ytp-skip-ad-button");
    const media = {};
    window.yt = { skipClicks: 0, apiSkips: 0, apiCalls: 0, noApi: false, resume: 0, ready: null, tooltip: true, quality: null, stillConfirmed: 0 };

    // API плеера, которым пользуется youtube-main.js.
    player.getVideoData = () => ({ video_id: new URLSearchParams(location.search).get("v") });
    player.getAvailableQualityLevels = () => ["hd1080", "hd720", "large", "medium", "auto"];
    player.setPlaybackQualityRange = (quality) => (yt.quality = quality);
    player.getPreferredQuality = () => yt.quality ?? "auto";
    // Как настоящий плеер: своя скорость не выше 2×, а повторная установка «той же» скорости ничего не меняет.
    let ytRate = 1;
    const speedDisplay = player.querySelector(".ytp-variable-speed-panel-display span");
    player.getPlaybackRate = () => ytRate;
    player.setPlaybackRate = (rate) => {
      rate = Math.min(2, Math.max(0.25, rate));
      if (rate === ytRate) return;
      ytRate = rate;
      video.playbackRate = rate;
      speedDisplay.textContent = `${rate.toFixed(2)}x`;
    };
    yt.upsell = 0;
    for (const chip of player.querySelectorAll(".ytp-variable-speed-panel-preset-button")) {
      chip.addEventListener("click", () => {
        if (chip.querySelector(".ytp-variable-speed-panel-premium-upsell-icon")) yt.upsell++;
        else player.setPlaybackRate(parseFloat(chip.textContent.replace(",", ".")));
      });
    }
    document.getElementById("speedPlus").addEventListener("click", () => player.setPlaybackRate(ytRate + 0.05));
    document.getElementById("speedMinus").addEventListener("click", () => player.setPlaybackRate(ytRate - 0.05));

    const autonav = player.querySelector(".ytp-autonav-toggle");
    autonav.addEventListener("click", () => {
      const btn = autonav.firstElementChild;
      btn.setAttribute("aria-checked", btn.getAttribute("aria-checked") === "true" ? "false" : "true");
    });

    yt.setHeatmap = (d) => player.querySelector(".ytp-heat-map-path").setAttribute("d", d);

    const still = document.querySelector("yt-confirm-dialog-renderer");
    still.querySelector("button").addEventListener("click", () => {
      yt.stillConfirmed++;
      still.style.display = "none";
    });
    yt.showStillWatching = () => {
      video.pause();
      still.style.display = "block";
    };

    // Как у настоящего плеера: кнопка «Пропустить» вызывает onAdUxClicked("skip-button", layoutId),
    // а layoutId текущей рекламы лежит в ответе плеера среди прочих.
    const AD_LAYOUT = "layout-current-ad";
    let currentLayout = AD_LAYOUT;
    player.getPlayerResponse = () => ({
      videoDetails: { videoId: new URLSearchParams(location.search).get("v"), channelId: "UC_TEST", author: "Тестовый канал" },
      adSlots: [{ adSlotRenderer: { fulfillmentContent: { fulfilledLayout: { playerBytesAdLayoutRenderer: { adLayoutMetadata: { layoutId: AD_LAYOUT } } } } } }],
      other: { layoutId: "layout-something-else" },
      playerConfig: { audioConfig: { loudnessDb: yt.loudness } },
    });

    // Звуковые дорожки как у настоящего плеера: тип зашит в id «251;<base64>», а YouTube сам включает дубляж.
    const trackId = (tags) => `251;${btoa(tags).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "")}`;
    yt.tracks = {
      original: { id: trackId("\n\x11\n\x05acont\x12\x08original\n\x08\n\x03drc\x12\x011\n\n\n\x04lang\x12\x02en"), Pb: { name: "Английский (оригинальная)", id: "en.4", isDefault: false, isAutoDubbed: false } },
      dub: { id: trackId("\n\x14\n\x05acont\x12\x0bdubbed-auto\n\n\n\x04lang\x12\x02ru"), Pb: { name: "Русский (озвучено автоматически)", id: "ru.10", isDefault: true, isAutoDubbed: true } },
      german: { id: trackId("\n\x0f\n\x05acont\x12\x06dubbed\n\n\n\x04lang\x12\x02de"), Pb: { name: "Немецкий", id: "de.3", isDefault: false, isAutoDubbed: false } },
    };
    yt.audioTrack = yt.tracks.dub;
    yt.audioSwitches = 0;
    player.getAvailableAudioTracks = () => Object.values(yt.tracks);
    player.getAudioTrack = () => yt.audioTrack;
    player.setAudioTrack = (track) => {
      yt.audioTrack = track;
      yt.audioSwitches++;
    };
    player.onAdUxClicked = (type, layoutId) => {
      if (yt.noApi) return;
      yt.apiCalls++;
      if (type === "skip-button" && layoutId === currentLayout && player.classList.contains("ad-showing")) {
        yt.apiSkips++;
        yt.endAd();
      }
    };

    const bar = player.querySelector(".ytp-progress-bar");
    const tooltip = player.querySelector(".ytp-tooltip");
    bar.addEventListener("mousemove", (e) => {
      if (!yt.tooltip) return;
      const r = bar.getBoundingClientRect();
      tooltip.style.display = "block";
      tooltip.style.left = `${e.clientX - player.getBoundingClientRect().left - 40}px`;
      const t = ((e.clientX - r.left) / r.width) * video.duration;
      tooltip.querySelector(".ytp-tooltip-progress-bar-pill-time-stamp").textContent =
        `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
    });
    bar.addEventListener("mouseleave", () => (tooltip.style.display = "none"));

    async function blobUrl(name, ext = "wav") {
      const res = await fetch(`/__media/${name}.${ext}`);
      return URL.createObjectURL(await res.blob());
    }

    yt.ready = (async () => {
      media.content = await blobUrl("content");
      media.ad = await blobUrl("ad");
      video.src = media.content;
      await video.play();
    })();

    // Блок рекламы в середине видео: приходит отдельным запросом, в getPlayerResponse() его нет.
    yt.loadAdBreak = async () => JSON.parse(await (await fetch("/__adbreak")).text());

    // Видео с настоящими кадрами (красная левая половина, синяя правая) — для подсветки.
    yt.playColor = async () => {
      video.src = await blobUrl("color", "webm");
      await video.play();
    };

    yt.startAd = async ({ skippableAfter = 60000, layoutId = AD_LAYOUT } = {}) => {
      currentLayout = layoutId;
      yt.resume = video.currentTime;
      player.classList.add("ad-showing");
      video.src = media.ad;
      // Расширение может пропустить рекламу раньше, чем play() успеет начаться, — это не ошибка.
      await video.play().catch(() => {});
      yt.skipTimer = setTimeout(() => (skip.style.display = "block"), skippableAfter);
    };

    yt.nextAd = async () => {
      video.src = media.ad;
      await video.play().catch(() => {});
    };

    yt.endAd = async () => {
      clearTimeout(yt.skipTimer);
      skip.style.display = "none";
      player.classList.remove("ad-showing");
      video.src = media.content;
      video.currentTime = yt.resume;
      await video.play();
    };

    skip.addEventListener("click", (e) => {
      if (!e.isTrusted) return;
      yt.skipClicks++;
      yt.endAd();
    });
    video.addEventListener("ended", () => {
      if (player.classList.contains("ad-showing")) yt.endAd();
    });
  </script>
</body>
</html>
